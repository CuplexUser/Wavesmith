[workspace]
members = ["crates/wavesmith-core", "crates/wavesmith-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests run long simulations; keep them fast without giving up debug assertions.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
